<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <title>The Flooded Floor &beta;版</title>
</head>

<body>
    <div id="setup-screen">
        <h1>The Flooded Floor &beta;版</h1>
        <p style="font-family: 'Courier New', Courier, monospace;">presented by 79th 3200</p>
        <br>
        <div class="input-group">
            <label>盤面サイズ (奇数推奨): </label>
            <input type="number" id="input-size" value="5" min="3" max="11">
        </div>
        <div class="input-group">
            <label>プレイヤー1の名前: </label>
            <input type="text" id="p1-name" value="p1">
            &nbsp;<label>色: </label><input type="color" id="p1-color" value="#ff4d4d">
        </div>
        <div class="input-group">
            <label>プレイヤー2の名前: </label>
            <input type="text" id="p2-name" value="p2">
            &nbsp;<label>色: </label><input type="color" id="p2-color" value="#4d79ff">
        </div>
        <br>
        <button id="start-btn">ゲーム開始 / Start the Game</button>
    </div>

    <div id="game-screen" class="hidden">
        <div id="info-panel">
            <div id="turn-display"></div>
            <div id="source-count"></div>
            <div id="score-display"></div>
        </div>

        <div id="action-panel">
            <button id="mode-source" class="mode-btn">水源設置</button>
            <button id="mode-wall" class="mode-btn">仕切り操作</button>
            <button id="mode-rag" class="mode-btn">雑巾</button>
            <button id="mode-sponge" class="mode-btn">スポンジ</button>
        </div>

        <div id="board-container">
            <div id="board"></div>
        </div>

        <div id="message-log"></div>

        <br>

        <div id="reset-button">
            <button id="reset" class="reset-btn">リセット</button>
        </div>
    </div>

    <div id="rules">
        <h2>ルール(簡易版)</h2>
        <ul>
            <li>水を設置したり、仕切りを動かしたり、水を拭き取ったりして、自分の色の水を増やしていこう！</li>
            <li>水は勝手に流れていく！</li>
            <!-- <li>水源はそれぞれ同時に2個まで存在できます。</li> -->
        </ul>
        <p>&beta;版なのでバグがあるかもしれません。</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
